name: CI

on:
  push:
    branches: [main]
  pull_request:

# Several Claude sessions push concurrently, so superseded PR runs are cancelled
# per-branch rather than left burning minutes on stale commits. Pushes to main
# queue instead of cancelling — a future deploy job must never be cut off
# mid-flight. Deploy jobs added later keep cancel-in-progress false.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The always-on gate: fill in the repo's real test commands (detect the stack
  # from lockfiles — pytest / vitest / go test / cargo test — never a no-op that
  # fakes green). This is the job the merge gate requires, whichever tier Step 3
  # chose: a required check in a native merge queue or branch protection, a
  # merge_condition in Mergify, or what the coordinator waits on between
  # serialized merges. Keep it un-path-filtered so it runs on every PR.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # - uses: actions/setup-<runtime>@vN
      # - run: <install dependencies>
      # - run: <run the test suite>
      - run: echo "REPLACE ME with the stack's test commands" && exit 1

  # ------------------------------------------------------------------------
  # DELETE THIS JOB unless the repo uses the Mergify tier (personal private
  # repos on GitHub Free). It's a narrow-but-real gate for a repo whose stack
  # doesn't exist yet: it validates the merge-gate config itself, so a malformed
  # file fails the build rather than silently disarming the queue every other
  # guardrail depends on. When a test suite lands, add its job to Mergify's
  # merge_conditions alongside this one.
  # ------------------------------------------------------------------------
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate .mergify.yml parses and defines the queue rule
        run: |
          python - <<'PY'
          import sys, yaml

          with open(".mergify.yml") as handle:
              config = yaml.safe_load(handle)

          queues = {rule["name"] for rule in config.get("queue_rules", [])}
          if "default" not in queues:
              sys.exit(".mergify.yml defines no 'default' queue rule — merges would not queue")

          labels = {
              condition
              for rule in config.get("pull_request_rules", [])
              for condition in rule.get("conditions", [])
          }
          if "label=queue" not in labels:
              sys.exit(".mergify.yml has no rule entered by label=queue — the queue label would do nothing")

          print("mergify config OK: 'default' queue rule present, entered by label=queue")
          PY
